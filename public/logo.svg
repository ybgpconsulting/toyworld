<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="400" height="100">
  <defs>
    <linearGradient id="twGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B2B" />
      <stop offset="100%" stop-color="#FF8A4C" />
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#FFA500" />
    </linearGradient>
  </defs>
  
  <!-- Icon: Playful Rocket / Star Block -->
  <g transform="translate(15, 10)">
    <!-- Rounded Background Cube -->
    <rect x="0" y="0" width="80" height="80" rx="20" fill="url(#twGrad)" />
    <!-- Inner Star / Spark -->
    <path d="M40 18 L46 32 L60 34 L50 44 L53 58 L40 50 L27 58 L30 44 L20 34 L34 32 Z" fill="url(#starGrad)" />
    <!-- Joyful Smile Accent -->
    <path d="M26 62 Q40 72 54 62" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" fill="none" />
  </g>

  <!-- Brand Typography -->
  <text x="110" y="52" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="38" letter-spacing="-0.5" fill="#FF6B2B">TOY</text>
  <text x="195" y="52" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="38" letter-spacing="-0.5" fill="#1A1A2E">WORLD</text>
  <text x="112" y="74" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="12" letter-spacing="3" fill="#888899">PAN-INDIA TOYS</text>
</svg>
