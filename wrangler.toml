name = "toy-world-worker"
main = "worker/src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "toy-world-db"
database_id = "placeholder-replace-after-create"
migrations_dir = "worker/migrations"

[[r2_buckets]]
binding = "R2"
bucket_name = "toy-world-media"

[vars]
# Local development only. Set production values with:
#   wrangler secret put CORS_ORIGIN
#   wrangler secret put ADMIN_JWT_SECRET
#   wrangler secret put GOOGLE_SHEETS_WEBHOOK_SECRET
CORS_ORIGIN = "http://localhost:5173,https://localhost:5173"

[dev]
port = 8787
local_protocol = "http"
